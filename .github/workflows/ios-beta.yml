name: iOS Beta Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Apple 现在强制要求上传 App Store Connect/TestFlight 必须用 iOS 26 SDK
  # (即 Xcode 26+),macos-15 这个 runner 镜像因为磁盘空间限制没有 Xcode 26,
  # 所以必须切到 macos-26 runner。
  # Xcode 26 默认开启 Explicit Modules,会导致 flutter_secure_storage 等
  # Swift 插件报 "Unable to find module dependency: 'Flutter'" (flutter/flutter#185210,
  # 官方还未修复)——这个问题改在 ios/Podfile 的 post_install 里对所有 Pod
  # 关闭 SWIFT_ENABLE_EXPLICIT_MODULES 来解决,详见 Podfile。
  XCODE_VERSION: '26.4.1'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Clean stale pub-cache temp dir
        # ~/.pub-cache/_temp 是 pub get 运行时的临时工作区,不应该被跨 run 缓存复用,
        # 上次 run 如果中途失败/被打断,残留的 _temp 会导致
        # 'Creation of temporary directory failed ... errno = 22'
        run: rm -rf ~/.pub-cache/_temp

      - name: Install Flutter dependencies
        run: flutter pub get


      # Temporary diagnostic patch for flutter_onnxruntime iOS:
      # force CoreML EP to use MLProgram instead of its default model format.
      # This only changes the GitHub macOS runner's pub-cache for this build.
      - name: Patch ONNX Runtime CoreML to MLProgram
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          import json
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config_path = Path('.dart_tool/package_config.json').resolve()
          config = json.loads(config_path.read_text(encoding='utf-8'))
          package = next(
              (p for p in config['packages'] if p['name'] == 'flutter_onnxruntime'),
              None,
          )
          if package is None:
              raise SystemExit('flutter_onnxruntime not found in .dart_tool/package_config.json')

          root_uri = package['rootUri']
          parsed = urlparse(root_uri)
          if parsed.scheme == 'file':
              plugin_root = Path(unquote(parsed.path))
          elif parsed.scheme:
              raise SystemExit(f'Unsupported flutter_onnxruntime rootUri: {root_uri}')
          else:
              plugin_root = (config_path.parent / unquote(root_uri)).resolve()

          # 优先在整个插件 ios/ 目录里找，而不是硬编码单一文件名，
          # 避免插件把 CoreML 注册逻辑放在别的 .swift 文件里导致找不到。
          ios_dir = plugin_root / 'ios'
          if not ios_dir.is_dir():
              raise SystemExit(f'iOS plugin source dir not found: {ios_dir}')

          swift_files = sorted(ios_dir.rglob('*.swift'))
          if not swift_files:
              raise SystemExit(f'No .swift files found under: {ios_dir}')

          if any('"ModelFormat": "MLProgram"' in f.read_text(encoding='utf-8') for f in swift_files):
              print('Already patched, skipping.')
              sys.exit(0)

          # 放宽匹配条件：
          # - 变量名不写死为 sessionOptions，任意合法 Swift 标识符都行
          # - 允许 try / try? / try!
          # - 允许调用写在多行、或后面跟着别的东西（用非贪婪匹配到右括号为止）
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)(?P<try>try[?!]?)\s+'
              r'(?P<recv>[A-Za-z_][A-Za-z0-9_]*)\.appendCoreMLExecutionProvider\(\s*\)'
          )

          target_file = None
          match = None
          for f in swift_files:
              text = f.read_text(encoding='utf-8')
              m = pattern.search(text)
              if m:
                  target_file = f
                  match = m
                  source = text
                  break

          if match is None:
              # 匹配失败时不要直接退出——把每个文件里所有含 "CoreML" 的行打印出来，
              # 这样第一次跑失败也能从 CI 日志里立刻看到真实的调用写法，
              # 不用再等一轮 20-30 分钟的 CI 才能定位问题。
              print('!!! Could not find appendCoreMLExecutionProvider() call. '
                    'Dumping all CoreML-related lines for manual inspection: !!!')
              for f in swift_files:
                  text = f.read_text(encoding='utf-8')
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if 'CoreML' in line:
                          print(f'{f}:{line_no}: {line}')
              raise SystemExit(
                  'Patch failed: no matching appendCoreMLExecutionProvider() call found. '
                  'See dumped lines above and adjust the regex accordingly.'
              )

          indent = match.group('indent')
          try_kw = match.group('try')
          recv = match.group('recv')
          replacement = (
              f'{indent}{try_kw} {recv}.appendCoreMLExecutionProvider(\n'
              f'{indent}    withOptionsV2: [\n'
              f'{indent}        "ModelFormat": "MLProgram"\n'
              f'{indent}    ]\n'
              f'{indent})'
          )
          patched = source[:match.start()] + replacement + source[match.end():]
          target_file.write_text(patched, encoding='utf-8')
          swift_file = target_file

          print(f'Patched CoreML ModelFormat=MLProgram: {swift_file}')
          lines = patched.splitlines()
          for line_no, line in enumerate(lines, 1):
              if 'ModelFormat' in line:
                  start = max(1, line_no - 3)
                  end = min(len(lines), line_no + 3)
                  print('--- patched CoreML snippet ---')
                  for n in range(start, end + 1):
                      print(f'{n}: {lines[n - 1]}')
                  print('------------------------------')
                  break
          PY_PATCH

      # Second diagnostic patch for flutter_onnxruntime iOS:
      # force graph optimization level down to "extended", skipping ORT_ENABLE_ALL's
      # extra layout-optimization pass which trips over SimplifiedLayerNormFusion
      # on this particular fp16 model (repro'd locally with onnxruntime==1.23.0:
      # ORT_ENABLE_ALL fails, ORT_ENABLE_EXTENDED/BASIC/DISABLE_ALL all succeed).
      - name: Patch ONNX Runtime graph optimization level
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          import json
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config_path = Path('.dart_tool/package_config.json').resolve()
          config = json.loads(config_path.read_text(encoding='utf-8'))
          package = next(
              (p for p in config['packages'] if p['name'] == 'flutter_onnxruntime'),
              None,
          )
          if package is None:
              raise SystemExit('flutter_onnxruntime not found in .dart_tool/package_config.json')

          root_uri = package['rootUri']
          parsed = urlparse(root_uri)
          if parsed.scheme == 'file':
              plugin_root = Path(unquote(parsed.path))
          elif parsed.scheme:
              raise SystemExit(f'Unsupported flutter_onnxruntime rootUri: {root_uri}')
          else:
              plugin_root = (config_path.parent / unquote(root_uri)).resolve()

          ios_dir = plugin_root / 'ios'
          if not ios_dir.is_dir():
              raise SystemExit(f'iOS plugin source dir not found: {ios_dir}')

          swift_files = sorted(ios_dir.rglob('*.swift'))
          if not swift_files:
              raise SystemExit(f'No .swift files found under: {ios_dir}')

          if any('setGraphOptimizationLevel' in f.read_text(encoding='utf-8') for f in swift_files):
              print('Already patched, skipping.')
              sys.exit(0)

          # 匹配 "let sessionOptions = try ORTSessionOptions()" 这行，
          # 变量名不写死，任意合法 Swift 标识符都行。
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)let (?P<recv>[A-Za-z_][A-Za-z0-9_]*) = try ORTSessionOptions\(\)'
          )

          target_file = None
          match = None
          for f in swift_files:
              text = f.read_text(encoding='utf-8')
              m = pattern.search(text)
              if m:
                  target_file = f
                  match = m
                  source = text
                  break

          if match is None:
              print('!!! Could not find "let x = try ORTSessionOptions()". '
                    'Dumping all ORTSessionOptions-related lines: !!!')
              for f in swift_files:
                  text = f.read_text(encoding='utf-8')
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if 'ORTSessionOptions' in line:
                          print(f'{f}:{line_no}: {line}')
              raise SystemExit('Patch failed: no matching ORTSessionOptions() init found.')

          indent = match.group('indent')
          recv = match.group('recv')
          insertion = (
              f'\n{indent}do {{\n'
              f'{indent}    try {recv}.setGraphOptimizationLevel(.extended)\n'
              f'{indent}}} catch {{\n'
              f'{indent}    print("[Depth] failed to set graph optimization level: \\(error)")\n'
              f'{indent}}}'
          )
          patched = source[:match.end()] + insertion + source[match.end():]
          target_file.write_text(patched, encoding='utf-8')

          print(f'Patched graph optimization level: {target_file}')
          lines = patched.splitlines()
          for line_no, line in enumerate(lines, 1):
              if 'setGraphOptimizationLevel' in line:
                  start = max(1, line_no - 2)
                  end = min(len(lines), line_no + 3)
                  print('--- patched snippet ---')
                  for n in range(start, end + 1):
                      print(f'{n}: {lines[n - 1]}')
                  print('-----------------------')
                  break
          PY_PATCH

      - name: Set build number
        # 每次上传 TestFlight 的 CFBundleVersion(build number)必须严格递增,
        # 用 GitHub Actions 的 run_number 保证每次 run 都不重复
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1)
          sed -i.bak "s/^version: .*/version: ${VERSION_NAME}+${{ github.run_number }}/" pubspec.yaml
          cat pubspec.yaml | grep version

      - name: Build Flutter iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # 只缓存 CocoaPods 下载源,不缓存 ios/Pods 产物本身,
      # 避免旧缓存在 flutter build ios 之后把刚生成的、和本次 Flutter 引擎
      # 严格匹配的 Pods 覆盖掉,导致 flutter_secure_storage 等插件报
      # 'Flutter/Flutter.h' file not found
      - name: Cache CocoaPods repo
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-repo-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-repo-

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: gem install fastlane

      - name: Run fastlane adhoc (Ad Hoc签名,用于R2/Diawi分发,不走TestFlight)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane adhoc

      - name: Run fastlane beta (可选,由仓库Variable PUSH_TO_TESTFLIGHT 控制,推送TestFlight)
        if: ${{ vars.PUSH_TO_TESTFLIGHT == 'true' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane beta

      - name: Get build info
        id: build_info
        run: |
          BUILD_TIME=$(date +%Y%m%d-%H%M%S)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=AITavern-${BUILD_TIME}.ipa" >> "$GITHUB_OUTPUT"

      - name: Generate manifest.plist
        run: |
          cat <<EOF > manifest.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>${{ vars.R2_PUBLIC_URL }}/ios-app/${{ steps.build_info.outputs.ipa_name }}</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.yoran.app</string>
                          <key>bundle-version</key>
                          <string>${{ github.run_number }}</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>AI Tavern</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Install AWS CLI (for R2 upload, R2兼容S3协议)
        run: |
          if ! command -v aws &> /dev/null; then
            pip3 install awscli --break-system-packages 2>/dev/null || pip3 install awscli
          fi

      - name: Upload IPA + manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          aws s3 cp ios/Runner.ipa \
            "s3://${{ vars.R2_BUCKET }}/ios-app/${{ steps.build_info.outputs.ipa_name }}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/octet-stream"

          aws s3 cp manifest.plist \
            "s3://${{ vars.R2_BUCKET }}/ios-app/manifest-${{ steps.build_info.outputs.build_time }}.plist" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/xml"

      - name: Print install link
        run: |
          MANIFEST_URL="${{ vars.R2_PUBLIC_URL }}/ios-app/manifest-${{ steps.build_info.outputs.build_time }}.plist"
          INSTALL_LINK="itms-services://?action=download-manifest&url=${MANIFEST_URL}"
          echo "$INSTALL_LINK" > install_link.txt
          echo "=================================================="
          echo "📱 手机Safari打开下面链接直接安装:"
          echo "$INSTALL_LINK"
          echo "=================================================="
          echo "### 📱 手机安装链接" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$INSTALL_LINK\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[点击安装](${INSTALL_LINK})" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate QR code and upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if ! command -v qrencode &> /dev/null; then
            brew install qrencode
          fi

          INSTALL_LINK=$(cat install_link.txt)
          qrencode -o qrcode.png -s 10 -m 2 "$INSTALL_LINK"

          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          QR_NAME="qrcode-${{ steps.build_info.outputs.build_time }}.png"

          aws s3 cp qrcode.png \
            "s3://${{ vars.R2_BUCKET }}/ios-app/qrcode/${QR_NAME}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "image/png"

          echo "qr_name=${QR_NAME}" >> "$GITHUB_OUTPUT"
        id: qr

      - name: Embed QR code in Summary
        run: |
          QR_URL="${{ vars.R2_PUBLIC_URL }}/ios-app/qrcode/${{ steps.qr.outputs.qr_name }}"
          {
            echo ""
            echo "### 📷 扫码安装 (iPhone相机或微信扫一扫)"
            echo ""
            echo "![install qrcode](${QR_URL})"
          } >> "$GITHUB_STEP_SUMMARY"