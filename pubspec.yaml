name: youran_ai
description: "Youran AI interactive story platform."
publish_to: 'none'

version: 1.0.0+62

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Existing project dependencies
  http: 1.6.0
  flutter_secure_storage: 9.2.0
  cupertino_icons: 1.0.8
  lucide_icons_flutter: 3.1.15
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2

  # Novel runtime dependencies
  web_socket_channel: 3.0.3
  shared_preferences: 2.5.3
  just_audio: 0.10.6
  file_picker: 11.0.3
  flutter_image_compress: 2.5.1
  crop_your_image: 2.0.0
  lottie: ^3.3.1
  record: 6.2.1

  # Motion sensors for 2.5D background parallax
  sensors_plus: ^6.1.2

  # Persistent network image cache
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2

  # Local Depth Anything V2 inference
  flutter_onnxruntime: ^1.8.4
  image: ^4.9.2

  # Crash reporting (版本以 pub.dev 最新为准，运行 flutter pub upgrade sentry_flutter 可更新)
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.13.1

  # 上传 iOS 符号文件(dSYM)到 Sentry，让崩溃堆栈显示函数名而不是内存地址
  sentry_dart_plugin: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# 符号文件上传配置。auth token 不要写在这里，
# 在云构建里设置环境变量 SENTRY_AUTH_TOKEN。
# 构建完成后运行：dart run sentry_dart_plugin
sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  project: flutter
  org: yoran
  wait_for_processing: false
  log_level: info

flutter:
  uses-material-design: true

  shaders:
    - shaders/depth_parallax.frag
    - shaders/procedural_vfx_post.frag

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/choices/
    - assets/images/novel/
    - assets/audio/weather/
    - assets/audio/ui/
    - assets/animations/meru_book_story_continuing.json
    - assets/images/world_map/
    - assets/images/companion_skill_icons/
    - assets/images/battle/status/
    - assets/models/

  fonts:
    - family: NovelMiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400

    - family: WenJinMinchoP0
      fonts:
        - asset: assets/fonts/WenJinMinchoP0-Regular.ttf
          weight: 400


    - family: LXGWWenKaiGBScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiGBScreen.ttf
          weight: 400