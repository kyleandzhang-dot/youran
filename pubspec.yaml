name: youran_ai
description: "Youran AI interactive story platform."
publish_to: 'none'

version: 1.0.0+42

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Existing project dependencies
  http: 1.6.0
  flutter_secure_storage: 9.2.0
  cupertino_icons: 1.0.8
  lucide_icons_flutter: 3.1.15

  # Novel runtime dependencies compatible with Dart 3.8.1
  web_socket_channel: 3.0.3
  shared_preferences: 2.5.3
  just_audio: 0.10.6
  file_picker: 11.0.3
  flutter_image_compress: 2.5.1
  crop_your_image: 2.0.0
  lottie: ^3.3.1
  record: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/novel/
    - assets/audio/weather/
    - assets/audio/ui/
    - assets/animations/meru_book_story_continuing.json

  fonts:
    - family: NovelMiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400

    - family: WenJinMinchoP0
      fonts:
        - asset: assets/fonts/WenJinMinchoP0-Regular.ttf
          weight: 400


    - family: LXGWWenKaiGBScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiGBScreen.ttf
          weight: 400
